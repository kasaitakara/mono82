<!DOCTYPE html>
<html lang="ja" class="theme-sprooto">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#090909"
  >

  <title>mono82</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
   href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
   rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>
  <main class="app">

    <header class="app-header">
      <div class="brand-row">
        <div
          id="current-project-name"
          class="current-project-name"
          aria-label="current project"
        >mono82</div>

        <div class="header-actions">
          <button
            id="theme-button"
            class="text-button"
            type="button"
            aria-label="theme"
            title="theme"
          ><svg class="mono82-icon mono82-theme-paint-icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect class="mono82-theme-paint-fill" x="6" y="1" width="4" height="2" />
              <path class="mono82-theme-paint-fill" d="M5 4h6v1h1v2h1v4h1v3H2v-3h1V7h1V5h1V4Z" />
              <rect class="mono82-theme-paint-cut" x="5" y="7" width="6" height="4" />
              <rect class="mono82-theme-paint-cut" x="3" y="12" width="10" height="1" />
            </svg></button>

          <select
            id="theme-selector"
            class="theme-selector-hidden"
            aria-label="theme"
            tabindex="-1"
          >
            <option value="theme-mono82">mono82</option>
            <option value="theme-sprooto">sprooto</option>
            <option value="theme-kasai">kasai</option>
            <option value="theme-mei">mei</option>
            <option value="theme-ryuichi">ryuichi</option>
            <option value="theme-aya">aya</option>
            <option value="theme-tobokegao">tobokegao</option>
            <option value="theme-hachi">hachi</option>
            <option value="theme-electro">electro</option>
            <option value="theme-game">game</option>
          </select>

          <button
            id="project-button"
            class="text-button"
            type="button"
            aria-label="project"
            title="project"
          >prj</button>

          <button
            id="export-button"
            class="text-button"
            type="button"
            aria-label="export"
            title="export"
          >exp</button>
        </div>
      </div>

      <div class="transport-row">
        <div class="transport-left">
          <button
            id="undo-button"
            class="text-button history-button"
            type="button"
            aria-label="undo"
            title="undo"
          ><svg class="mono82-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 5v3h-2v2H8M11 6 7 10l4 4" />
            </svg></button>

          <button
            id="redo-button"
            class="text-button history-button"
            type="button"
            aria-label="redo"
            title="redo"
          ><svg class="mono82-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5v3h2v2h9M13 6l4 4-4 4" />
            </svg></button>
        </div>

        <div class="transport-center">
          <button
            id="play-button"
            class="play-button"
            type="button"
            aria-label="play / stop"
          ><svg class="mono82-icon mono82-icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="7,4 11,4 11,6 14,6 14,8 17,8 17,10 20,10 20,14 17,14 17,16 14,16 14,18 11,18 11,20 7,20" />
            </svg></button>
        </div>

        <div class="transport-right">
          <label
            class="master-control"
            aria-label="master volume"
          >
            <span class="control-label">vol</span>

            <input
              id="master-volume"
              type="range"
              min="0"
              max="100"
              value="70"
            >

            <output
              id="master-volume-value"
            >70</output>
          </label>

          <label
            class="bpm-control"
            aria-label="bpm"
          >
            <span class="control-label">bpm</span>

            <input
              id="bpm-input"
              type="number"
              min="40"
              max="300"
              value="120"
            >
          </label>
        </div>
      </div>
    </header>


    <section
      class="sequence-section mokton-view mokton-sequence-view"
      aria-label="sequence"
    >
      <div class="section-toolbar">
        <button
          id="current-source-display"
          class="current-source-display mokton-view-button"
          type="button"
          aria-label="back to song"
          title="song"
        >01</button>
      </div>

      <div
        id="sequence-grid"
        class="sequence-grid"
      ></div>
    </section>


    <section
      class="pattern-section mokton-view mokton-pattern-view"
      aria-label="pattern manager"
    >
      <div class="section-toolbar">
        <button
          id="pattern-edit-button"
          class="pattern-edit-button"
          type="button"
          aria-label="edit selected pattern"
          title="pattern edit"
        >
          <span class="mono82-pattern-edit-icon" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
            <i></i><i></i><i></i><i></i>
          </span>
        </button>

        <button
          id="pattern-loop-button"
          class="pattern-loop-button"
          type="button"
          aria-pressed="false"
        >
          <svg class="mono82-icon mono82-icon-loop" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11V9h2V7h11" />
            <polygon points="21,7 17,3 17,11" />
            <path d="M20 13v2h-2v2H7" />
            <polygon points="3,17 7,13 7,21" />
          </svg>
        </button>
      </div>

      <div
        id="pattern-grid"
        class="pattern-grid"
      ></div>
    </section>



    <section
      class="editor-section mokton-view mokton-shared-view"
      aria-label="sound editor"
    >
      <div id="editor"></div>
    </section>


    <!--
      Stage compatibility.
      ui.jsが次の整理段階まで参照する旧IDだけ残す。
      画面には出さない。
    -->
    <div
      class="legacy-stage-hooks"
      hidden
      aria-hidden="true"
    >
      <button
        id="sequence-page-button"
        type="button"
      ></button>

      <input
        id="pattern-length-input"
        type="number"
        value="32"
      >

      <button
        id="pattern-page-button"
        type="button"
      ></button>

      <div id="section-list"></div>
      <div id="song-parts"></div>
      <div id="song-grid"></div>
      <div id="song-master-mix"></div>

      <button
        id="song-page-button"
        type="button"
      ></button>

      <button
        id="sequence-view-toggle"
        type="button"
      ></button>

      <button
        id="song-editor-view-toggle"
        type="button"
      ></button>
    </div>

  </main>

  <script
    type="module"
    src="./js/main.js"
  ></script>
</body>
</html>
